#theme: jekyll-theme-primer
#theme: jekyll-theme-cayman
theme: jekyll-theme-slate
lsi: false
safe: false
incremental: false
highlighter: rouge
plugins:
  - jekyll-include-cache
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge


title: Open Decentralized AI
description: An open, decentralized, community-owned artificial intelligence ecosystem
## Using jekyll-theme-primer (GitHub Pages supported)

url: https://free-llm.github.io
baseurl: /

custom_css:
  - assets/css/custom.css
color_scheme: dark

nav_sort: case_insensitive

footer_content: >
  Built in the open. Owned by the community.

aux_links:
  GitHub Organization:
    - https://github.com/free-llm

# Removed just-the-docs specific configuration; using a GitHub Pages supported theme

exclude:
  - .VolumeIcon.icns
